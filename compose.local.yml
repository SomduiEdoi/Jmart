name: jmart-local

services:
  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_FILE: /data/jmart.sqlite
      JWT_SECRET: ${JMART_LOCAL_JWT_SECRET:-local-dev-only-change-me}
      JWT_EXPIRES_IN: 12h
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./data/local-sample:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
